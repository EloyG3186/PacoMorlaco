<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Paco el Morlaco</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,700;0,800;1,300;1,400;1,500;1,700;1,800&family=Montserrat+Alternates:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<body>
    <!-- Background Gradients -->
    <div class="gradient-background">
        <div class="gradient-background__layer gradient-background__layer--1"></div>
        <div class="gradient-background__layer gradient-background__layer--2"></div>
        <div class="gradient-background__layer gradient-background__layer--3"></div>
        <div class="gradient-background__layer gradient-background__layer--4"></div>
        <div class="gradient-background__layer gradient-background__layer--5"></div>
        <div class="gradient-background__overlay"></div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header__container">
            <!-- Logo -->
            <div class="logo">
                <a href="index.html" class="logo__link">
                    <div class="logo__content">
                        <img src="assets/images/logo.png" alt="Logo Paco el Morlaco" class="logo__image">
                        <div class="logo__text">Toma mi mano</div>
                    </div>
                </a>
                <div class="logo__border"></div>
            </div>

            <!-- Navigation Public -->
            <nav class="nav nav--public">
                <div class="nav__backdrop"></div>
                <div class="nav__item">
                    <a href="index.html" class="nav__link">Inicio</a>
                </div>
                <div class="nav__item">
                    <a href="donante-campanas.html" class="nav__link">Campañas</a>
                </div>
                <div class="nav__item">
                    <a href="index.html#contacto" class="nav__link">Contacto</a>
                </div>
            </nav>

            <!-- Header Actions -->
            <div class="header__actions">
                <a href="login.html" class="btn-secondary">Login</a>
                <a href="registro.html" class="btn-primary">Sign Up</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <!-- Auth Section -->
            <section class="auth-section">
                <div class="auth-container" style="max-width: 650px;">
                    <!-- Auth Card -->
                    <div class="auth-card">
                        <h1 class="auth-card__title">Crear Cuenta</h1>
                        <p class="auth-card__subtitle">Únete a nuestra comunidad y ayuda a cambiar vidas</p>

                        <!-- Register Form -->
                        <form class="auth-form">
                            <!-- User Type Selection -->
                            <div class="form-group">
                                <label class="form-label">Quiero registrarme como:</label>
                                <div class="user-type-selector">
                                    <label class="user-type-option">
                                        <input type="radio" name="userType" value="donante" class="radio" checked>
                                        <div class="user-type-card">
                                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M20.84 4.61C20.3292 4.099 19.7228 3.69364 19.0554 3.41708C18.3879 3.14052 17.6725 2.99817 16.95 2.99817C16.2275 2.99817 15.5121 3.14052 14.8446 3.41708C14.1772 3.69364 13.5708 4.099 13.06 4.61L12 5.67L10.94 4.61C9.9083 3.57831 8.50903 2.99871 7.05 2.99871C5.59096 2.99871 4.19169 3.57831 3.16 4.61C2.1283 5.64169 1.54871 7.04097 1.54871 8.5C1.54871 9.95903 2.1283 11.3583 3.16 12.39L4.22 13.45L12 21.23L19.78 13.45L20.84 12.39C21.351 11.8792 21.7564 11.2728 22.0329 10.6054C22.3095 9.93789 22.4518 9.22248 22.4518 8.5C22.4518 7.77752 22.3095 7.06211 22.0329 6.39464C21.7564 5.72718 21.351 5.12084 20.84 4.61Z" stroke="#8AA0EA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                            <h3>Donante</h3>
                                            <p>Quiero apoyar campañas y ayudar a quienes lo necesitan</p>
                                        </div>
                                    </label>
                                    <label class="user-type-option">
                                        <input type="radio" name="userType" value="beneficiario" class="radio">
                                        <div class="user-type-card">
                                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M20 21V19C20 17.9391 19.5786 16.9217 18.8284 16.1716C18.0783 15.4214 17.0609 15 16 15H8C6.93913 15 5.92172 15.4214 5.17157 16.1716C4.42143 16.9217 4 17.9391 4 19V21" stroke="#8AA0EA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                                <path d="M12 11C14.2091 11 16 9.20914 16 7C16 4.79086 14.2091 3 12 3C9.79086 3 8 4.79086 8 7C8 9.20914 9.79086 11 12 11Z" stroke="#8AA0EA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                            <h3>Beneficiario</h3>
                                            <p>Necesito una prótesis y quiero solicitar apoyo</p>
                                        </div>
                                    </label>
                                </div>
                            </div>

                            <!-- Name Fields -->
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">Nombre</label>
                                    <input type="text" class="input" placeholder="Juan" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Apellido</label>
                                    <input type="text" class="input" placeholder="Pérez" required>
                                </div>
                            </div>

                            <!-- Email -->
                            <div class="form-group">
                                <label class="form-label">Correo electrónico</label>
                                <input type="email" class="input" placeholder="tu@ejemplo.com" required>
                            </div>

                            <!-- Password Fields -->
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">Contraseña</label>
                                    <input type="password" class="input" placeholder="••••••••" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Confirmar contraseña</label>
                                    <input type="password" class="input" placeholder="••••••••" required>
                                </div>
                            </div>

                            <!-- Terms & Conditions -->
                            <div class="form-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" class="checkbox" required>
                                    <span>Acepto los <a href="#" class="auth-link">términos y condiciones</a> y la <a href="#" class="auth-link">política de privacidad</a></span>
                                </label>
                            </div>

                            <!-- Submit Button -->
                            <button type="submit" class="btn-primary-text" style="width: 100%; margin-top: 16px;">
                                Crear Cuenta
                            </button>
                        </form>

                        <!-- Divider -->
                        <div class="auth-divider">
                            <span>o regístrate con</span>
                        </div>

                        <!-- Social Login -->
                        <div class="social-login">
                            <button class="social-btn">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M22.56 12.25C22.56 11.47 22.49 10.72 22.36 10H12V14.26H17.92C17.66 15.63 16.88 16.79 15.71 17.57V20.34H19.28C21.36 18.42 22.56 15.6 22.56 12.25Z" fill="#4285F4"/>
                                    <path d="M12 23C14.97 23 17.46 22.02 19.28 20.34L15.71 17.57C14.73 18.23 13.48 18.63 12 18.63C9.13 18.63 6.71 16.7 5.84 14.1H2.18V16.94C3.99 20.53 7.7 23 12 23Z" fill="#34A853"/>
                                    <path d="M5.84 14.1C5.62 13.44 5.49 12.73 5.49 12C5.49 11.27 5.62 10.56 5.84 9.9V7.06H2.18C1.43 8.55 1 10.22 1 12C1 13.78 1.43 15.45 2.18 16.94L5.84 14.1Z" fill="#FBBC05"/>
                                    <path d="M12 5.38C13.62 5.38 15.06 5.91 16.21 7.02L19.36 3.87C17.45 2.09 14.97 1 12 1C7.7 1 3.99 3.47 2.18 7.06L5.84 9.9C6.71 7.3 9.13 5.38 12 5.38Z" fill="#EA4335"/>
                                </svg>
                                Google
                            </button>
                            <button class="social-btn">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M24 12C24 5.37258 18.6274 0 12 0C5.37258 0 0 5.37258 0 12C0 17.9895 4.3882 22.954 10.125 23.8542V15.4688H7.07812V12H10.125V9.35625C10.125 6.34875 11.9166 4.6875 14.6576 4.6875C15.9701 4.6875 17.3438 4.92188 17.3438 4.92188V7.875H15.8306C14.34 7.875 13.875 8.80008 13.875 9.75V12H17.2031L16.6711 15.4688H13.875V23.8542C19.6118 22.954 24 17.9895 24 12Z" fill="#1877F2"/>
                                </svg>
                                Facebook
                            </button>
                        </div>

                        <!-- Login Link -->
                        <div class="auth-footer">
                            <p>¿Ya tienes una cuenta? <a href="login.html" class="auth-link">Inicia sesión aquí</a></p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
